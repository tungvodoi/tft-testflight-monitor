name: TFT TestFlight Monitor

on:
  schedule:
    # Runs automatically every 5 minutes (the fastest free limit on GitHub)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to manually trigger the check anytime

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution and saves your private minutes

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Check Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tft_tracker.py
